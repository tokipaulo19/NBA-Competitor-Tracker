name: NBA Weekly Instagram Tracker

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 8:00 AM Brisbane time
    # GitHub cron uses UTC
    - cron: "0 22 * * 0"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run scheduled NBA tracker
        if: github.event_name == 'schedule'
        run: |
          python src/collect_instagram_apify.py --mode continue

      - name: Run manual NBA tracker
        if: github.event_name == 'workflow_dispatch'
        run: |
          python src/collect_instagram_apify.py --mode continue --replace-existing

      - name: Commit tracker data
        run: |
          git config user.name "NBA Competitor Tracker"
          git config user.email "actions@github.com"

          git add data/instagram_snapshots.csv

          if [ -f data/profile_validation_errors.csv ]; then
            git add data/profile_validation_errors.csv
          fi

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Weekly NBA competitor snapshot $(date -u +'%Y-%m-%d')"
          git push
