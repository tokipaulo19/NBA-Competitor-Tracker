name: NBA Weekly Instagram Tracker

on:
  workflow_dispatch:

  schedule:
    # Monday 8:00 AM Brisbane time
    # GitHub cron is UTC, so this runs Sunday 22:00 UTC.
    - cron: "0 22 * * 0"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled NBA tracker
        if: github.event_name == 'schedule'
        run: |
          python src/collect_instagram_apify.py --mode continue

      - name: Run manual NBA tracker
        if: github.event_name == 'workflow_dispatch'
        run: |
          python src/collect_instagram_apify.py --mode continue --replace-existing

      - name: Generate 30-day+ competitor report
        run: |
          python src/generate_weekly_report.py

      - name: Generate modern Excel report
        run: |
          python src/generate_modern_excel_report.py

      - name: Commit tracker data and reports
        run: |
          git config user.name "NBA Competitor Tracker"
          git config user.email "actions@github.com"

          git add data/instagram_snapshots.csv
          git add data/weekly_report.csv
          git add data/NBA_Competitor_Report_Latest.xlsx

          if [ -f data/profile_validation_errors.csv ]; then
            git add data/profile_validation_errors.csv
          fi

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Weekly NBA competitor report $(date -u +'%Y-%m-%d')"
          git push
