name: Personalised Posing Weekly Instagram Tracker

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "config/personalisedposing_competitors.csv"
      - "src/collect_instagram_apify.py"
      - "src/generate_weekly_report.py"
      - ".github/workflows/personalised-posing-instagram-tracker.yml"

  schedule:
    # Monday 9:00 AM Brisbane time, after the NBA tracker has finished.
    - cron: "0 23 * * 0"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled Personalised Posing tracker
        if: github.event_name == 'schedule'
        run: |
          python src/collect_instagram_apify.py --mode continue --competitors-file config/personalisedposing_competitors.csv --snapshot-file data/personalisedposing/instagram_snapshots.csv --error-file data/personalisedposing/profile_validation_errors.csv --tracker-name "Personalised Posing Competitor Tracker"

      - name: Run manual Personalised Posing tracker
        if: github.event_name == 'workflow_dispatch'
        run: |
          python src/collect_instagram_apify.py --mode continue --replace-existing --competitors-file config/personalisedposing_competitors.csv --snapshot-file data/personalisedposing/instagram_snapshots.csv --error-file data/personalisedposing/profile_validation_errors.csv --tracker-name "Personalised Posing Competitor Tracker"

      - name: Refresh Personalised Posing tracker after configuration changes
        if: github.event_name == 'push'
        run: |
          python src/collect_instagram_apify.py --mode continue --replace-existing --competitors-file config/personalisedposing_competitors.csv --snapshot-file data/personalisedposing/instagram_snapshots.csv --error-file data/personalisedposing/profile_validation_errors.csv --tracker-name "Personalised Posing Competitor Tracker"

      - name: Generate 30-day+ competitor report
        run: |
          python src/generate_weekly_report.py --snapshot-file data/personalisedposing/instagram_snapshots.csv --historical-file data/personalisedposing/historical.csv --report-file data/personalisedposing/weekly_report.csv --target-handle personalisedposing --target-label "Personalised Posing"

      - name: Commit tracker data and report
        run: |
          git config user.name "Personalised Posing Competitor Tracker"
          git config user.email "actions@github.com"

          git add data/personalisedposing/instagram_snapshots.csv
          git add data/personalisedposing/weekly_report.csv

          if [ -f data/personalisedposing/profile_validation_errors.csv ]; then
            git add data/personalisedposing/profile_validation_errors.csv
          fi

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Weekly Personalised Posing competitor report $(date -u +'%Y-%m-%d')"
          git push
